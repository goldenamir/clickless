# Clickless - Configuration
# Free keyboard-driven mouse control for macOS (Mouseless-compatible)

# ─── Keybindings ─────────────────────────────────────────────────
keybindings:
  # Overlay
  show_overlay: "ShiftLeft tap"           # tap = press+release < tap_threshold ms
  hide_overlay: "Escape"
  move_to_next_monitor: "ShiftRight tap"
  move_to_prev_monitor: "ShiftLeft tap"   # while overlay visible
  edit_config: "Tab"
  toggle_continuous_mode: ""
  cycle_grid_action_level: ""
  toggle_overlay_lock: ""

  # Mouse actions (while overlay is up)
  execute_mouse_action: "Space"
  execute_mouse_move: "AltLeft tap"
  undo_last_key: "Backspace"
  release_hold_drag: "Escape"
  repeat_last_action: ""
  hold_for_move: "AltLeft"
  hold_for_drag: "AltLeft"
  hold_for_right_button: "Shift"
  hold_for_middle_button: ""
  hold_for_back_button: ""
  hold_for_forward_button: ""
  cycle_mouse_action: ""
  cycle_mouse_button: ""
  cycle_click_count: ""

  # Free mode
  toggle_free_mode: "ControlLeft tap"
  enter_free_mode: ""
  exit_free_mode: ""
  free_move_up: "I"
  free_move_down: "K"
  free_move_left: "J"
  free_move_right: "L"
  free_hold_speed_increase: ["S", "D", "F"]
  free_hold_speed_decrease: "A"
  free_wheel_up: "M"
  free_wheel_down: ","
  free_wheel_left: "."
  free_wheel_right: "/"
  free_click_left: "Space"
  free_click_right: "R"
  free_click_middle: "E"
  free_click_back: "Q"
  free_click_forward: "W"

  # Global mouse buttons (work without overlay/free mode)
  global_left_click: ""
  global_right_click: ""
  global_middle_click: ""

# ─── Grid (overlay) options ──────────────────────────────────────
# Two-letter hint grid: screen is covered with labeled cells (e.g. "AS", "AD").
# Type 2 letters to jump cursor there, then IJKL to refine if needed.
# Space to click at cursor position.
grid:
  hint_cell_width: 80
  hint_cell_height: 55

# ─── Behavior ────────────────────────────────────────────────────
behavior:
  # Overlay / cursor
  initial_overlay_monitor: "primary"
  initial_action_location: "virtual_cursor"   # virtual_cursor | system_cursor | screen_center
  hide_cursor_on_click: false
  hide_location: "bottom_left"
  continuous_mode: false

  # Movement / timing
  move_duration_ms: 35
  move_system_cursor_with_virtual: false
  multi_click_threshold_ms: 300
  tap_threshold_ms: 200

  # Free mode
  free_mode:
    base_move_speed: 24
    move_speed_multiplier: 2.5
    movement_easing_factor: 0.45
    base_wheel_speed: 5
    wheel_speed_multiplier: 3.0
    wheel_easing_factor: 0.2
    wheel_step_size: 3
    wheel_step_size_large: 10
    auto_off_seconds: 10           # 0 = disabled

# ─── Style / Appearance ─────────────────────────────────────────
style:
  master_opacity: 1.0

  # Background
  background_colors: ["#1a1a2e"]
  color_block_size: 0

  # Highlight
  highlight_color: [0, 1, 0.53, 0.25]
  highlight_animation_ms: 100
  show_initial_highlight: false

  # Grid lines
  grid_line_style: "lines"          # lines | dots
  grid_line_width: 1
  grid_line_color: [0.3, 0.8, 0.5, 0.35]
  subgrid_line_color: [0.3, 0.8, 0.5, 0.2]

  # Text
  font: "monospace"
  font_weight: "bold"
  font_size_multiplier: 1.0
  subgrid_font_size_multiplier: 0.8
  text_color: [1, 1, 1, 0.85]
  subgrid_text_color: [1, 1, 1, 0.6]
  text_shadow_rgba: [0, 0, 0, 0.5]
  char_display: "all"               # all | first | none

  # Cursor (virtual)
  cursor_size: 12
  cursor_color: [1, 0.3, 0.3, 0.85]
  cursor_right_button_color: [0.3, 0.5, 1, 0.85]
  cursor_move_color: [0.3, 1, 0.5, 0.85]
  cursor_drag_color: [1, 0.8, 0.2, 0.85]

  # Overlay background
  overlay_opacity: 0.22
